name: Linux Build
run-name: Build Linux versions of MeshAgent
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  linux-build-x86:
    runs-on: ubuntu-24.04
    env:
      # Highest glibc the x86 agents may require. The ubuntu-24.04 runner is glibc 2.39, and
      # building on it bakes GLIBC_2.38 symbols (__isoc23_strtol, fmod@2.38, ...) into every
      # binary, which then refuses to start on RHEL 9 / Rocky 9 / Alma 9 (glibc 2.34),
      # Ubuntu 22.04 and Debian 12. Building in debian:bookworm (glibc 2.36) tops out at
      # 2.34, the same floor as the aarch64 agent below.
      GLIBC_MAX: '2.34'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      # Everything builds inside one older-glibc container, so the runner image can be bumped
      # without changing which distros the agents run on. 32-bit needs gcc-multilib (the
      # runner image has it preinstalled, a container does not) plus the :i386 dev packages
      # for jconfig.h and the kernel headers. Debian names the JPEG headers libjpeg62-turbo-dev.
      # They are JPEG_LIB_VERSION 62, so the makefile keeps the default (non-v80) libturbojpeg.a.
      # musl-tools is for the Alpine (musl, static) target, which does not depend on glibc.
      #
      # AUDIO=1 enables the Opus/PulseAudio KVM audio path. Only the
      # KVM-enabled targets get it, and only those with a committed
      # lib-opus/linux/$(ARCHNAME)/libopus.a: x86 (5), x86-64 (6), arm64 (26).
      # The NOKVM and Alpine targets below must stay without it.
      #
      # CAMERA=1 enables the V4L2 webcam path on the same KVM-enabled targets.
      # It needs no extra package or library: V4L2 is kernel ioctls via
      # linux/videodev2.h (from libc6-dev, already present), and the JPEG work
      # it does uses the libjpeg-turbo the KVM build already links.
      - name: Build x86 / x86-64 / Alpine in an older-glibc container
        run: |
          docker run --rm -v "${{ github.workspace }}":/src -w /src debian:bookworm bash -c '
            set -e
            dpkg --add-architecture i386
            apt-get update
            apt-get install -y git build-essential gcc-multilib pkg-config musl-tools libc6-dev-i386 linux-libc-dev:i386 libjpeg62-turbo-dev libjpeg62-turbo-dev:i386 libx11-dev libxtst-dev libxext-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev libpulse-dev
            git config --global --add safe.directory /src
            make -j4 linux ARCHID=5 AUDIO=1 CAMERA=1 && make clean
            make -j4 linux ARCHID=6 AUDIO=1 CAMERA=1 && make clean
            make -j4 linux ARCHID=19 && make clean
            make -j4 linux ARCHID=20 && make clean
            make -j4 linux ARCHID=33 && make clean
          '
      # Fail the build, instead of shipping, if a future change pulls a newer glibc back in.
      # The Alpine binary is static musl and has no glibc requirement to check.
      - name: Verify the glibc floor
        run: sh .github/scripts/check-glibc-floor.sh "$GLIBC_MAX" meshagent_x86 meshagent_x86-64 meshagent_x86_nokvm meshagent_x86-64_nokvm
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-x86
          path: ${{ github.workspace }}/meshagent_*

  linux-build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo apt clean all && sudo apt update &&
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libjpeg-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev build-essential libpulse-dev
      - name: Build ARM64 Linux
        run: make -j4 linux ARCHID=26 AUDIO=1 CAMERA=1 && make clean
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-arm
          path: ${{ github.workspace }}/meshagent_*

  linux-build-aarch64-glibc:
    name: aarch64 glibc (ARCHID=32, meshagent_aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      # ARCHID=32 is MeshCentral's distributed 64-bit ARM slot (meshagent_aarch64); ARCHID=26
      # above (meshagent_arm64) is the legacy twin the server marks "replaced by ARCHID 32".
      # The makefile now gates the Bootlin cross-toolchain behind CROSS=1, so a plain build uses
      # the container's native gcc and strip (an arm64 container, so the binary is aarch64).
      # bookworm (glibc 2.36) runs on Pi OS Bookworm and Trixie; Debian 11 bullseye is EOL and 404s.
      #
      # AUDIO=1 CAMERA=1: MeshCentral serves this one file, meshagent_aarch64, to devices reporting ARCHID 26 or 32, so it
      # is what every ARM64 device downloads, and it must carry the microphone/camera/audio support like the x86 builds do
      # (lib-opus/linux/aarch64 is committed). libpulse-dev is needed for the PulseAudio headers.
      - name: Build aarch64 (ARCHID=32) in an older-glibc container
        run: |
          docker run --rm -v "${{ github.workspace }}":/src -w /src debian:bookworm bash -c '
            apt-get update &&
            apt-get install -y git build-essential pkg-config libx11-dev libxtst-dev libxext-dev libjpeg-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev libpulse-dev &&
            git config --global --add safe.directory /src &&
            make -j4 linux ARCHID=32 AUDIO=1 CAMERA=1
          '
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-aarch64
          path: ${{ github.workspace }}/meshagent_aarch64

  linux-build-armhf-glibc:
    name: armhf glibc (ARCHID=25, meshagent_armhf, armv6)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Enable 32-bit ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      # 32-bit Raspberry Pi (meshagent_armhf). Built armv6 hardfloat in a Raspbian container
      # under QEMU so the one armhf binary runs on every 32-bit Pi, Zero/1 (armv6) through
      # 2/3/4 (armv7); a Debian armhf image would be armv7 and skip Pi Zero/1. ARCHID=25
      # defaults to native gcc when CROSS is unset. bullseye keeps the glibc floor at 2.31.
      - name: Build armhf (ARCHID=25) in an armv6 container
        run: |
          docker run --rm --platform linux/arm/v6 --entrypoint /bin/bash -v "${{ github.workspace }}":/src -w /src balenalib/rpi-raspbian:bullseye -c '
            apt-get update &&
            apt-get install -y git build-essential pkg-config libx11-dev libxtst-dev libxext-dev libjpeg-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev &&
            git config --global --add safe.directory /src &&
            make -j4 linux ARCHID=25
          '
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-armhf
          path: ${{ github.workspace }}/meshagent_armhf
